    folderRef: .
    instructionTarget:
      agent: codex
      folderRef: .
    artifactIds:
      - artifact-workspace-manifest
    eligibleOperatorIds:
      - operator-codex
      - operator-claude
      - operator-hermes
    source:
      kind: workspace-file
      sourceRef: ASSET_SYSTEM.yaml#workOrders.work-order-first-operation
    acceptanceCriteria:
      - id: truth-sourced
        description: The report records exact local verification results and a defensible READY or NOT READY decision.
      - id: first-outcome
        description: Every pre-existing user-owned dirty file remains byte-for-byte unchanged and no forbidden operation is used.
    updatedAt: 2026-08-08T07:02:51.819Z
    executionPolicy:
      version: 1
      adapter: codex
      cwd: work-order-folder
      permissionMode: workspace-write
      networkMode: blocked
      timeoutSeconds: 1800
      retry:
        maxAttempts: 1
        backoffSeconds: 0
      evidencePolicy:
        required:
          - instruction-snapshot
          - policy-snapshot
          - work-order-revision
          - terminal-log
          - exit-code
        completionProposal: required
      checkpointConditions:
