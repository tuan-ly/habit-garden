<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Habit Garden - Core User Loop</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">The loop the UI must make instantly understandable, rewarding, and low-guilt.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <circle cx="700" cy="410" r="230" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="4"/>
    <circle cx="700" cy="410" r="112" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
    <text x="645" y="392" font-size="24" font-weight="700" fill="#166534">Plant</text>
    <text x="598" y="428" font-size="17" fill="#475569">habit identity</text>
    <text x="574" y="458" font-size="17" fill="#475569">and emotional reward</text>

    <rect x="110" y="310" width="270" height="140" rx="20" fill="#fffbeb" stroke="#facc15" filter="url(#shadow)"/>
    <text x="144" y="354" font-size="22" font-weight="700" fill="#92400e">1. Choose habit</text>
    <text x="144" y="390" font-size="16" fill="#78350f">Create a plant for a routine,</text>
    <text x="144" y="418" font-size="16" fill="#78350f">goal, or identity direction.</text>

    <rect x="500" y="150" width="400" height="132" rx="20" fill="#eff6ff" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="534" y="194" font-size="22" font-weight="700" fill="#1d4ed8">2. Daily check-in</text>
    <text x="534" y="230" font-size="16" fill="#1e40af">Water plant, log progress, or rest gently.</text>
    <text x="534" y="258" font-size="16" fill="#1e40af">This is the highest-frequency UX surface.</text>

    <rect x="1020" y="310" width="270" height="140" rx="20" fill="#fdf2f8" stroke="#f9a8d4" filter="url(#shadow)"/>
    <text x="1054" y="354" font-size="22" font-weight="700" fill="#be185d">3. See response</text>
    <text x="1054" y="390" font-size="16" fill="#9d174d">Plant grows, moisture changes,</text>
    <text x="1054" y="418" font-size="16" fill="#9d174d">XP, coins, streaks, weather.</text>

    <rect x="500" y="560" width="400" height="132" rx="20" fill="#f0fdf4" stroke="#86efac" filter="url(#shadow)"/>
    <text x="534" y="604" font-size="22" font-weight="700" fill="#166534">4. Return tomorrow</text>
    <text x="534" y="640" font-size="16" fill="#166534">Low-pressure persistence: the garden should</text>
    <text x="534" y="668" font-size="16" fill="#166534">invite return without shame or alarm.</text>

    <path d="M 380 354 C 454 240, 502 216, 500 216" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 900 216 C 980 238, 1020 306, 1020 354" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 1155 450 C 1050 602, 924 626, 900 626" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 500 626 C 344 606, 245 492, 245 450" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="64" y="36" width="0" height="0" fill="none"/>
    <rect x="88" y="696" width="1224" height="38" rx="19" fill="#0f172a"/>
    <text x="124" y="721" font-size="16" fill="#e2e8f0">Expert focus: make the reward loop readable in 3 seconds, especially on mobile, without making the product feel punitive.</text>
  </g>
</svg>
