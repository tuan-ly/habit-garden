<svg width="1400" height="880" viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="880" fill="#f8fafc"/>
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Habit Garden - Information Architecture</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">Map for a UI/UX expert: entry points, protected app areas, and core product systems.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="64" y="160" width="260" height="170" rx="18" fill="#ecfdf5" stroke="#86efac" filter="url(#shadow)"/>
    <text x="92" y="204" font-size="22" font-weight="700" fill="#166534">Public Onboarding</text>
    <text x="92" y="240" font-size="16" fill="#166534">Landing</text>
    <text x="92" y="270" font-size="16" fill="#166534">Pricing</text>
    <text x="92" y="300" font-size="16" fill="#166534">Signup / Login</text>

    <rect x="400" y="160" width="260" height="170" rx="18" fill="#eff6ff" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="428" y="204" font-size="22" font-weight="700" fill="#1d4ed8">Auth Gate</text>
    <text x="428" y="240" font-size="16" fill="#1e40af">Supabase session</text>
    <text x="428" y="270" font-size="16" fill="#1e40af">Protected redirects</text>
    <text x="428" y="300" font-size="16" fill="#1e40af">Dashboard providers</text>

    <rect x="736" y="140" width="600" height="220" rx="22" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="772" y="186" font-size="24" font-weight="700" fill="#0f172a">Main App Shell</text>
    <text x="772" y="222" font-size="16" fill="#475569">Game HUD: XP, level, mood, coins</text>
    <text x="772" y="252" font-size="16" fill="#475569">Bottom nav: Today, Garden, Store, Stats, Menu</text>
    <text x="772" y="282" font-size="16" fill="#475569">Mobile-first PWA / Capacitor app surface</text>
    <text x="772" y="312" font-size="16" fill="#475569">Visual style: calm garden game, not productivity dashboard</text>

    <line x1="324" y1="245" x2="400" y2="245" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="660" y1="245" x2="736" y2="245" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="64" y="450" width="240" height="180" rx="18" fill="#fffbeb" stroke="#fcd34d" filter="url(#shadow)"/>
    <text x="92" y="494" font-size="22" font-weight="700" fill="#92400e">Today</text>
    <text x="92" y="530" font-size="16" fill="#78350f">Daily action loop</text>
    <text x="92" y="560" font-size="16" fill="#78350f">Water plants</text>
    <text x="92" y="590" font-size="16" fill="#78350f">Log goal progress</text>

    <rect x="340" y="450" width="240" height="180" rx="18" fill="#ecfdf5" stroke="#86efac" filter="url(#shadow)"/>
    <text x="368" y="494" font-size="22" font-weight="700" fill="#166534">Garden</text>
    <text x="368" y="530" font-size="16" fill="#166534">Isometric canvas</text>
    <text x="368" y="560" font-size="16" fill="#166534">Plants and decorations</text>
    <text x="368" y="590" font-size="16" fill="#166534">Weather and states</text>

    <rect x="616" y="450" width="240" height="180" rx="18" fill="#fdf2f8" stroke="#f9a8d4" filter="url(#shadow)"/>
    <text x="644" y="494" font-size="22" font-weight="700" fill="#be185d">Store</text>
    <text x="644" y="530" font-size="16" fill="#9d174d">Craft recipes</text>
    <text x="644" y="560" font-size="16" fill="#9d174d">Materials</text>
    <text x="644" y="590" font-size="16" fill="#9d174d">Coin shop</text>

    <rect x="892" y="450" width="240" height="180" rx="18" fill="#eef2ff" stroke="#a5b4fc" filter="url(#shadow)"/>
    <text x="920" y="494" font-size="22" font-weight="700" fill="#4338ca">Stats</text>
    <text x="920" y="530" font-size="16" fill="#3730a3">Weekly activity</text>
    <text x="920" y="560" font-size="16" fill="#3730a3">Streaks</text>
    <text x="920" y="590" font-size="16" fill="#3730a3">Period overview</text>

    <rect x="1168" y="450" width="168" height="180" rx="18" fill="#faf5ff" stroke="#d8b4fe" filter="url(#shadow)"/>
    <text x="1196" y="494" font-size="22" font-weight="700" fill="#7e22ce">Menu</text>
    <text x="1196" y="530" font-size="16" fill="#6b21a8">Profile</text>
    <text x="1196" y="560" font-size="16" fill="#6b21a8">Identity</text>
    <text x="1196" y="590" font-size="16" fill="#6b21a8">Settings</text>

    <line x1="1036" y1="360" x2="184" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1036" y1="360" x2="460" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1036" y1="360" x2="736" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1036" y1="360" x2="1012" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1036" y1="360" x2="1252" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="64" y="730" width="1272" height="74" rx="18" fill="#0f172a"/>
    <text x="94" y="775" font-size="18" font-weight="700" fill="#ffffff">Main design tension:</text>
    <text x="288" y="775" font-size="18" fill="#cbd5e1">the app wants to feel like a delightful garden game, while still explaining measurable habit and goal progress clearly.</text>
  </g>
</svg>
